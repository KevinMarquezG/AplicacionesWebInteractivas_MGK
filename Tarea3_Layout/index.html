<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Layout</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>

    <body>
        <header>
            <div class="row align-items-center py-3 border-bottom">
                <div class="col-6 col-md-3">
                    <img src="logotipo_recortado.jpg" class="img-fluid" width="150" height="150" alt="Logo" />
                </div>

                <div class="col-6 col-md-9">
                    <ul class="list-inline text-end mb-0">
                        <li class="list-inline-item d-none d-md-inline"><a href="#" class="text-decoration-none">Inicio</a></li>
                        <li class="list-inline-item d-none d-md-inline"><a href="#" class="text-decoration-none">Servicios</a></li>
                        <li class="list-inline-item d-none d-md-inline"><a href="#" class="text-decoration-none">Contacto</a></li>
                        <li class="list-inline-item"><button class="btn btn-primary btn-sm">Login</button></li>
                    </ul>
                </div>
            </div>
        </header>
        <main>
             <div class="row my-4">
                <div class="col-12 bg-primary text-white p-5 rounded text-center">
                    <h1 class="display-4">Bienvenido a mi tienda</h1>
                    <p class="lead">Vendemos productos digitales para tu negocio</p>
                    <button class="btn btn-light btn-lg">Iniciar</button>
                </div>
            </div>
        </main>
            <div class="row g-3 my-4">
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="card h-150">
                        <div class="card-body text-center">
                            <h5 class="card-title">Servicio 1</h5>
                            <p class="card-text">Descripción del servicio 1</p>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="card h-150">
                        <div class="card-body text-center">
                            <h5 class="card-title">Servicio 2</h5>
                            <p class="card-text">Descripción del servicio 2</p>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="card h-150">
                        <div class="card-body text-center">
                            <h5 class="card-title">Servicio 3</h5>
                            <p class="card-text">Descripción del servicio 3</p>
                        </div>
                    </div>
                </div>
            </div>
        <footer class="text-center py-4 mt-5 border-top">
            <p class="text-muted">
                <i class="bi bi-grid-3x3-gap-fill text-primary"></i>
                &nbsp; &copy; 2024 Mi Tienda Digital. Todos los derechos reservados.
            </p>
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
