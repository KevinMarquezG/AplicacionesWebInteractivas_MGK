<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>

    <body>
        <header class="border-bottom shadow-sm">
            <nav class="navbar navbar-expand-lg bg-dark">
                <div class="container">
                    <a class="navbar-brand fw-bold text-white" href="#">MovieReviews</a>
                    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarDemo">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarDemo">
                        <ul class="navbar-nav ms-auto align-items-center">
                            <li class="nav-item"><a class="nav-link text-white" href="#">Inicio</a></li>
                            <li class="nav-item"><a class="nav-link text-white" href="#">Favoritos</a></li>
                            <li class="nav-item ms-lg-2 mt-2 mt-lg-0">
                                <input class="form-control form-control-sm" type="text" placeholder="Buscar Películas..." />
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>
        <main container py-4>
            <div class="text-center my-4">
                <h1 class="main-title d-flex justify-content-center align-items-center gap-2">
                    <i class="bi bi-film text-primary"></i> Películas <span class="highlight">Destacadas</span>
                </h1>
                <p class="text-muted small">Las mejores películas según la crítica y el público</p>
            </div>
            <div class="d-flex justify-content-start flex-wrap gap-2 mb-4" id="contenedorCategorias">
                <button type="button" class="btn btn-primary active btn-categoria" data-categoria="todo">Todos</button>
                <button type="button" class="btn btn-outline-secondary btn-categoria" data-categoria="nuevo">1990-1999</button>
                <button type="button" class="btn btn-outline-secondary btn-categoria" data-categoria="oferta">2000-2009</button>
                <button type="button" class="btn btn-outline-secondary btn-categoria" data-categoria="eco">2010-2019</button>
                <button type="button" class="btn btn-outline-secondary btn-categoria" data-categoria="eco">2020-2025</button>
            </div>
        </main>
        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
        <script src="js/index.js"></script>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    </body>
</html>
